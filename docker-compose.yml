services:
  postgres:
    image: postgres:17-alpine
    container_name: chelaa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chelaa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chelaa}
      POSTGRES_DB: ${POSTGRES_DB:-chelaa}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chelaa} -d ${POSTGRES_DB:-chelaa}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
